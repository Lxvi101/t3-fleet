<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T3 Fleet</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">T3 Fleet<i id="conn" title="connecting"></i></span>
      <nav class="seg" id="views"><button data-view="map">Map</button><button data-view="list">List</button></nav>
      <input id="search" type="search" placeholder="Search" autocomplete="off" />
      <nav class="seg" id="windows"><button data-window="active">Now</button><button data-window="24h">24h</button><button data-window="7d">7d</button></nav>
      <span class="grow"></span>
      <span id="down" class="down"></span>
      <button id="needs" class="needs" hidden></button>
      <div id="usage" class="usage"></div>
    </header>
    <main class="layout">
      <section id="map" class="map"></section>
      <section id="list" class="list" hidden></section>
      <aside class="side">
        <div id="sentinel" hidden>
          <form id="ask" autocomplete="off"><input name="q" placeholder="Ask your fleet" /></form>
          <div id="answer" class="answer" hidden></div>
          <div id="alerts"></div>
          <div id="briefing" class="briefing"></div>
        </div>
        <ol id="history"></ol>
      </aside>
    </main>
    <div id="drawer" class="drawer" hidden>
      <div class="scrim" data-close></div>
      <article class="panel"><div id="drawer-body"></div></article>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
