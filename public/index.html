<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>T3 Fleet</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header class="bar">
      <span class="brand">T3 Fleet<i id="conn" title="connecting"></i></span>
      <nav class="seg" id="views"><button data-view="map">Map</button><button data-view="list">List</button></nav>
      <input id="search" type="search" placeholder="Search" autocomplete="off" />
      <nav class="seg" id="windows"><button data-window="active">Now</button><button data-window="24h">24h</button><button data-window="7d">7d</button></nav>
      <span class="grow"></span>
      <span id="down" class="down"></span>
      <button id="needs" class="needs" hidden></button>
      <div id="usage" class="island" hidden>
        <div class="island-pill"></div>
        <div class="island-panel"></div>
      </div>
    </header>
    <main class="layout">
      <div class="stage">
        <section id="map" class="map"></section>
        <section id="list" class="list" hidden></section>
        <div id="chat" class="chat" hidden>
          <div class="thread" hidden>
            <div class="thread-head"><span id="chat-agent"></span><button class="x" data-chat="clear" title="Clear conversation">Clear</button><button class="x" data-chat="hide" title="Minimise">–</button></div>
            <div class="messages"></div>
          </div>
          <form class="composer" autocomplete="off">
            <textarea rows="1" placeholder="Ask your fleet anything…"></textarea>
            <div class="tools">
              <button type="button" class="chip" data-ask="brief">Brief me</button>
              <button type="button" class="chip" data-ask="What needs me right now, and what exactly should I do?">What needs me?</button>
              <button type="button" class="chip" data-ask="What failed or got stuck in the last 24 hours, and why?">Failures</button>
              <span class="grow"></span>
              <button type="submit" class="send" title="Send (Enter)">↑</button>
            </div>
          </form>
        </div>
      </div>
      <aside class="side">
        <div id="alerts"></div>
        <ol id="history"></ol>
      </aside>
    </main>
    <div id="drawer" class="drawer" hidden>
      <div class="scrim" data-close></div>
      <article class="panel"><div id="drawer-body"></div></article>
    </div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
